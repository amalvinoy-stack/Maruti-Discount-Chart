<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maruti Discount Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #eef1f6;
    --card: #ffffff;
    --ink: #10141c;
    --muted: #626b7a;
    --border: #e3e7ee;
    --border-strong: #cfd6e0;
    --brand: #d21e2b;
    --brand-dark: #a3121d;
    --brand-ink: #ffffff;
    --accent: #0b5cad;
    --field-bg: #f7f9fc;
    --ok-bg: #ecf9f1;
    --ok-ink: #10683b;
    --ok-border: #b6e6c8;
    --warn-bg: #fdeeef;
    --warn-ink: #9c1420;
    --warn-border: #f3c8cc;
    --radius: 18px;
    --shadow: 0 24px 60px -22px rgba(16, 24, 40, .28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    line-height: 1.55;
    padding: 40px 16px 72px;
    background:
      radial-gradient(1200px 480px at 50% -140px, rgba(210, 30, 43, .16), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: #fff; color: var(--brand);
    font-weight: 700; letter-spacing: .6px; font-size: 11px;
    padding: 7px 14px; border-radius: 999px; text-transform: uppercase;
    border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(16,24,40,.06);
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--brand); }
  h1 {
    font-family: "Sora", sans-serif; font-weight: 800; letter-spacing: -.02em;
    font-size: 32px; margin: 16px 0 6px; line-height: 1.1;
  }
  header p { color: var(--muted); margin: 0 auto; font-size: 15px; max-width: 420px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px;
    box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
    background: linear-gradient(90deg, var(--brand), var(--brand-dark));
  }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 7px; color: #2b3340; }
  label .req { color: var(--brand); }
  .control { position: relative; }
  select, input {
    width: 100%; padding: 13px 14px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--border-strong); border-radius: 12px;
    background: var(--field-bg); color: var(--ink); appearance: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  select { padding-right: 40px; cursor: pointer; }
  .control.select-wrap::after {
    content: ""; position: absolute; right: 15px; top: 50%; width: 9px; height: 9px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  select:hover, input:hover { border-color: #b4bdca; }
  select:focus, input:focus {
    outline: none; border-color: var(--accent); background: #fff;
    box-shadow: 0 0 0 4px rgba(11, 92, 173, .14);
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .combo { position: relative; }
  .combo-list {
    list-style: none; margin: 6px 0 0; padding: 6px;
    position: absolute; left: 0; right: 0; top: 100%; z-index: 20;
    background: #fff; border: 1px solid var(--border-strong); border-radius: 12px;
    max-height: 244px; overflow-y: auto; box-shadow: 0 16px 40px rgba(16,24,40,.18);
  }
  .combo-list li {
    padding: 11px 12px; font-size: 15px; border-radius: 9px; cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .combo-list li:hover, .combo-list li.active { background: #eaf2fb; color: var(--accent); font-weight: 600; }
  .combo-list li.empty { color: var(--muted); cursor: default; font-weight: 400; }
  .combo-list li.empty:hover { background: transparent; color: var(--muted); }
  .age-box {
    margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; min-height: 18px;
  }
  .age-box.pill {
    display: inline-block; background: #eaf2fb; padding: 5px 11px; border-radius: 999px;
    border: 1px solid #cfe0f4;
  }
  .row { display: flex; gap: 12px; margin-top: 22px; }
  .btn {
    flex: 1; padding: 15px 16px; font-size: 15px; font-weight: 700; font-family: inherit;
    border: none; border-radius: 12px; cursor: pointer;
    transition: transform .08s ease, filter .15s ease, background .15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    flex: 2; background: linear-gradient(180deg, var(--brand), var(--brand-dark));
    color: var(--brand-ink); box-shadow: 0 10px 22px -8px rgba(210, 30, 43, .6);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-reset { background: #eef0f4; color: #2b3340; border: 1px solid var(--border-strong); }
  .btn-reset:hover { background: #e3e6ec; }
  .result { margin-top: 22px; }
  .result-card {
    border-radius: 14px; padding: 24px; text-align: center; border: 1px solid transparent;
    animation: pop .28s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .result-card.ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok-ink); }
  .result-card.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-ink); }
  .result-card .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; opacity: .85; }
  .result-card .val { font-family: "Sora", sans-serif; font-size: 56px; font-weight: 800; line-height: 1.05; margin: 8px 0; letter-spacing: -.02em; }
  .result-card .sub { font-size: 13px; opacity: .92; }
  .error-text { color: var(--warn-ink); font-size: 13px; margin-top: 12px; text-align: center; font-weight: 600; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; line-height: 1.6; }
  footer .footer-note { color: var(--brand); font-weight: 600; }
  footer .footer-credit { margin-top: 2px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Maruti Suzuki Discount Finder</h1>
      <p>Enter the vehicle details below to instantly find the applicable discount.</p>
    </header>

    <div class="card">
      <div class="field">
        <label for="vehicleType">Vehicle Type <span class="req">*</span></label>
        <div class="control select-wrap"><select id="vehicleType"></select></div>
      </div>

      <div class="field">
        <label for="businessType">Business Type <span class="req">*</span></label>
        <div class="control select-wrap"><select id="businessType"></select></div>
      </div>

      <div class="field">
        <label for="ncb">NCB Available <span class="req">*</span></label>
        <div class="control select-wrap"><select id="ncb"></select></div>
      </div>

      <div class="field">
        <label for="model">Model <span class="req">*</span></label>
        <div class="combo" id="modelCombo">
          <input id="model" placeholder="Type to search model..." autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="modelOptions" />
          <ul class="combo-list" id="modelOptions" role="listbox" hidden></ul>
        </div>
        <div class="hint">Start typing to search, then click a model from the list.</div>
      </div>

      <div class="field">
        <label for="fuel">Fuel <span class="req">*</span></label>
        <div class="control select-wrap"><select id="fuel"></select></div>
      </div>

      <div class="field">
        <label for="regDate">Registration Date <span class="req">*</span></label>
        <input id="regDate" type="date" />
        <div class="age-box" id="ageBox"></div>
      </div>

      <div class="row">
        <button class="btn btn-primary" id="findBtn">Click to see the applicable Discount</button>
        <button class="btn btn-reset" id="resetBtn">Reset</button>
      </div>

      <div id="errorText" class="error-text"></div>
      <div class="result" id="result"></div>
    </div>

    <footer>
      <div class="footer-note">Discounts shown are based on the Maruti Discount Grid Revision dated 05 Mar 2026</div>
      <div class="footer-credit">&copy; Amal Vinoy</div>
    </footer>
  </div>

NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"RITZ","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"S-CROSS","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"SUPER CARRY","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"SWIFT","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"SWIFT DZIRE","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"SX4","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"VITARA BREZZA","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":70},{"m":"ZEN","f":"DIESEL","n":"NO","fa":3651,"ta":18250,"b":"Rollover","v":"COMMERCIAL","d":0},{"m":"VICTORIS","f":"PETROL","n":"NO","fa":0,"ta":364,"b":"New Car","v":"COMMERCIAL","d":51}];
  const META = {"vehicleTypes":["COMMERCIAL","PRIVATE CAR"],"businessTypes":["New Car","Own Renewal","Rollover"],"ncb":["NO","YES"],"fuels":["DIESEL","PETROL"],"models":["A-STAR","ALTO","ALTO K10","ALTURA","BALENO","BREZZA","CELERIO","CIAZ","EECO/VERSA","ERTIGA","ESTEEM","ESTILO","FRONX","GRAND VITARA","GYPSY","IGNIS","INVICTO","JIMNY","KIZASHI","LIANA","MARUTI1000","MARUTI800","OMNI","RITZ","S-CROSS","S-PRESSO","SUPER CARRY","SWIFT","SWIFT DZIRE","SX4","VICTORIS","VITARA BREZZA","WAGON R","XL6","ZEN"]};

  const $ = (id) => document.getElementById(id);

  function fill(sel, items, placeholder) {
    sel.innerHTML = '<option value="">' + placeholder + '</option>' +
      items.map(v => '<option value="' + v + '">' + v + '</option>').join('');
  }

  fill($('vehicleType'), META.vehicleTypes, 'Select vehicle type');
  fill($('businessType'), META.businessTypes, 'Select business type');
  fill($('ncb'), META.ncb, 'Select NCB');
  fill($('fuel'), META.fuels, 'Select fuel');
  // Custom searchable model dropdown
  (function initModelCombo() {
    const input = $('model');
    const listEl = $('modelOptions');
    let activeIdx = -1;
    let filtered = [];

    function openList() { listEl.hidden = false; input.setAttribute('aria-expanded', 'true'); }
    function closeList() { listEl.hidden = true; input.setAttribute('aria-expanded', 'false'); activeIdx = -1; }

    function render(term) {
      const q = term.trim().toUpperCase();
      filtered = META.models.filter(m => m.toUpperCase().includes(q));
      if (!filtered.length) {
        listEl.innerHTML = '<li class="empty">No matching model</li>';
        openList();
        return;
      }
      listEl.innerHTML = filtered.map((m, i) =>
        '<li role="option" data-idx="' + i + '"' + (i === activeIdx ? ' class="active"' : '') + '>' + m + '</li>'
      ).join('');
      openList();
    }

    function choose(val) {
      input.value = val;
      closeList();
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    input.addEventListener('focus', () => render(input.value));
    input.addEventListener('input', () => { activeIdx = -1; render(input.value); });

    input.addEventListener('keydown', (e) => {
      if (listEl.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { render(input.value); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); if (filtered.length) { activeIdx = (activeIdx + 1) % filtered.length; render(input.value); } }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (filtered.length) { activeIdx = (activeIdx - 1 + filtered.length) % filtered.length; render(input.value); } }
      else if (e.key === 'Enter') { if (!listEl.hidden && activeIdx >= 0 && filtered[activeIdx]) { e.preventDefault(); choose(filtered[activeIdx]); } }
      else if (e.key === 'Escape') { closeList(); }
    });

    listEl.addEventListener('mousedown', (e) => {
      const li = e.target.closest('li[data-idx]');
      if (!li) return;
      e.preventDefault();
      choose(filtered[Number(li.dataset.idx)]);
    });

    document.addEventListener('click', (e) => {
      if (!$('modelCombo').contains(e.target)) closeList();
    });
  })();

  function todayMidnight() {
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }

  function ageInDays(regStr) {
    if (!regStr) return null;
    const parts = regStr.split('-').map(Number);
    const reg = new Date(parts[0], parts[1] - 1, parts[2]);
    if (isNaN(reg.getTime())) return null;
    const diff = todayMidnight() - reg;
    return Math.floor(diff / 86400000);
  }

  function updateAge() {
    const days = ageInDays($('regDate').value);
    const box = $('ageBox');
    if (days === null) { box.textContent = ''; box.classList.remove('pill'); return; }
    if (days < 0) { box.textContent = 'Registration date is in the future.'; box.classList.remove('pill'); return; }
    const years = (days / 365).toFixed(1);
    box.textContent = 'Vehicle age: ' + days.toLocaleString('en-IN') + ' days (~' + years + ' years)';
    box.classList.add('pill');
  }

  $('regDate').max = (() => {
    const t = todayMidnight();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  })();
  $('regDate').addEventListener('change', updateAge);
  $('regDate').addEventListener('input', updateAge);

  function findDiscount() {
    $('errorText').textContent = '';
    $('result').innerHTML = '';

    const v = $('vehicleType').value;
    const b = $('businessType').value;
    const n = $('ncb').value;
    const m = $('model').value.trim();
    const f = $('fuel').value;
    const regStr = $('regDate').value;

    const missing = [];
    if (!v) missing.push('Vehicle Type');
    if (!b) missing.push('Business Type');
    if (!n) missing.push('NCB Available');
    if (!m) missing.push('Model');
    if (!f) missing.push('Fuel');
    if (!regStr) missing.push('Registration Date');
    if (missing.length) { $('errorText').textContent = 'Please fill: ' + missing.join(', ') + '.'; return; }

    if (!META.models.includes(m)) {
      $('errorText').textContent = 'Please choose a valid model from the list.';
      return;
    }

    const days = ageInDays(regStr);
    if (days === null || days < 0) { $('errorText').textContent = 'Please enter a valid registration date.'; return; }

    const match = DATA.find(r =>
      r.v === v && r.b === b && r.n === n.toUpperCase() &&
      r.m === m && r.f === f.toUpperCase() &&
      days >= r.fa && days <= r.ta
    );

    if (!match) {
      $('result').innerHTML =
        '<div class="result-card warn">' +
          '<div class="lbl">No discount found</div>' +
          '<div class="sub">No matching discount for this combination and vehicle age (' + days.toLocaleString('en-IN') + ' days).</div>' +
        '</div>';
      return;
    }

    $('result').innerHTML =
      '<div class="result-card ok">' +
        '<div class="lbl">Applicable Discount</div>' +
        '<div class="val">' + match.d + '%</div>' +
        '<div class="sub">' + m + ' • ' + f + ' • ' + b + ' • Age ' + days.toLocaleString('en-IN') + ' days</div>' +
      '</div>';
  }

  function resetForm() {
    ['vehicleType','businessType','ncb','fuel'].forEach(id => $(id).value = '');
    $('model').value = '';
    $('regDate').value = '';
    $('ageBox').textContent = '';
    $('ageBox').classList.remove('pill');
    $('errorText').textContent = '';
    $('result').innerHTML = '';
  }

  $('findBtn').addEventListener('click', findDiscount);
  $('resetBtn').addEventListener('click', resetForm);
</script>
